server.port=8081
spring.application.name=customer-service
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${JWT_SECRET:dev-jwt-secret-local-only-do-not-use-in-production}
app.jwt.expiration-ms=86400000
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
app.internal.service-secret=${INTERNAL_SERVICE_SECRET:dev-internal-secret-local-only}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
